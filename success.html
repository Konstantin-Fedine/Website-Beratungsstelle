<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vielen Dank | Aufwind Beratung</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/success.css" />
  </head>

  <body>
    <main>
      <section class="success">
        <div class="success-card">
          <div class="success-icon">✅</div>

          <h1>Termin erfolgreich gebucht</h1>

          <p id="success-intro">Vielen Dank — Ihre Buchung wurde gespeichert.</p>

          <div class="booking-details">
            <p><strong>Buchungsnummer:</strong> <span id="booking-id">—</span></p>
            <p><strong>Leistung:</strong> <span id="booking-service">—</span></p>
            <p><strong>Datum &amp; Uhrzeit:</strong> <span id="booking-datetime">—</span></p>
          </div>

          <p id="success-note">Sie erhalten in Kürze eine Bestätigung per E‑Mail.</p>

          <a href="index.html" class="btn btn-primary"> Zur Startseite </a>
        </div>
      </section>
    </main>

    <script src="js/header.js"></script>
    <script src="js/load-components.js"></script>
    <script>
      // Parse query params und fülle die Erfolgseite
      (function () {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const service = params.get("service");
        const date = params.get("date");
        const time = params.get("time");
        const createdAt = params.get("created_at");

        if (id) {
          document.getElementById("booking-id").textContent = id;
        }

        if (service) {
          document.getElementById("booking-service").textContent = decodeURIComponent(service);
        }

        if (date || time) {
          const parts = [];
          if (date) parts.push(date);
          if (time) parts.push(time);
          document.getElementById("booking-datetime").textContent = parts.join(" um ");
        }

        if (createdAt) {
          try {
            const d = new Date(createdAt);
            const formatted = d.toLocaleString(undefined, {
              year: "numeric",
              month: "2-digit",
              day: "2-digit",
              hour: "2-digit",
              minute: "2-digit",
            });
            const p = document.createElement("p");
            p.innerHTML = `<strong>Erfasst am:</strong> ${formatted}`;
            document.querySelector(".booking-details").appendChild(p);
          } catch (e) {
            // ignore parse errors
          }
        }

        // If no params, show a generic message
        if (!id && !service && !date && !time) {
          document.getElementById("success-intro").textContent =
            "Ihre Buchung wurde verarbeitet. Weitere Details finden Sie in Ihrem Posteingang.";
        }
      })();
    </script>
  </body>
</html>
